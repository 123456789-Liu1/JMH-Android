name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法！请先说明**要解决什么问题**，而不是只描述实现方式。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题？
      description: 描述当前的不便之处
      placeholder: 例如：我每次打开应用都要重新输入密码，太麻烦
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方式
      placeholder: 例如：支持指纹解锁，同时保留密码作为兜底
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 兼容性确认
      description: 本项目有两条硬性约束，请确认你的建议不违反
      options:
        - label: 该功能不需要联网
          required: true
        - label: 该功能不会降低加密强度，也不引入密码找回之类的后门
          required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认没有重复
          required: true

name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置签名密钥（KEYSTORE_BASE64），将使用调试签名构建"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/jmh-release.jks
          printf 'storeFile=keystore/jmh-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          echo "签名配置完成"

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: 校验签名一致性
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::未找到 Release APK"
            exit 1
          fi
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --print-certs "$APK" | head -5

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jmh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: jmh-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  test:
    name: 设备端测试
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 启用 KVM 加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 运行加解密测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

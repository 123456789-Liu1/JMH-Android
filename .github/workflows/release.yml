name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 发布 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: 重命名产物
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/release/app-release.apk \
             release-out/JMH-${GITHUB_REF_NAME}-release.apk

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*.apk
          generate_release_notes: true
          draft: false
          body: |
            ## 下载

            下载下方 APK 直接安装即可（Android 10 及以上）。

            > 默认使用调试签名便于安装体验，如需长期使用请自行签名。

            ## 校验

            本版本由 GitHub Actions 自动构建，源码对应提交 ${{ github.sha }}。
